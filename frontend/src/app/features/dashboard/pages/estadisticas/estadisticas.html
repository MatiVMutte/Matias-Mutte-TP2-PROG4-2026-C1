<div class="min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-8 space-y-6">

    <!-- Header -->
    <div>
      <h1 class="text-2xl font-bold text-white">Estadísticas</h1>
      <p class="text-blue-300 text-sm">Métricas de actividad de la plataforma</p>
    </div>

    <!-- Filtro de fechas -->
    <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-xl p-4 flex flex-wrap items-end gap-3">
      <div>
        <label class="text-blue-300 text-xs block mb-1">Desde</label>
        <input type="date" [ngModel]="desde()" (ngModelChange)="desde.set($event)"
          class="bg-white/10 border border-white/15 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-400/50" />
      </div>
      <div>
        <label class="text-blue-300 text-xs block mb-1">Hasta</label>
        <input type="date" [ngModel]="hasta()" (ngModelChange)="hasta.set($event)"
          class="bg-white/10 border border-white/15 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-400/50" />
      </div>
      <button (click)="cargar()"
        class="bg-blue-600 hover:bg-blue-500 transition text-white text-sm font-semibold px-4 py-2 rounded-xl">
        Aplicar
      </button>
      <button (click)="limpiar()"
        class="text-blue-300 hover:text-white text-sm font-medium px-3 py-2 rounded-xl hover:bg-white/10 transition">
        Limpiar
      </button>
    </div>

    @if (isLoading()) {
      <div class="flex justify-center py-16">
        <svg class="w-8 h-8 animate-spin text-blue-400" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
      </div>
    } @else {
      <!-- Gráfico de barras: publicaciones por usuario -->
      <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-5">
        <h2 class="text-white font-semibold text-base mb-4">Publicaciones por usuario</h2>
        <app-bar-chart [data]="pubPorUsuario()" />
      </div>

      <!-- Gráfico de líneas: comentarios por fecha -->
      <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-5">
        <h2 class="text-white font-semibold text-base mb-4">Comentarios por fecha</h2>
        <app-line-chart [data]="comentPorFecha()" />
      </div>

      <!-- Gráfico de torta: comentarios por publicación -->
      <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-5">
        <h2 class="text-white font-semibold text-base mb-4">Comentarios por publicación</h2>
        <app-pie-chart [data]="comentPorPublicacion()" />
      </div>
    }

  </div>
</div>
