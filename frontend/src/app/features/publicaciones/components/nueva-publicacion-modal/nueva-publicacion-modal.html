<!-- Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);">

  <div class="w-full max-w-lg bg-gradient-to-b from-blue-950 to-blue-900 border border-white/10 rounded-2xl shadow-2xl overflow-hidden">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-white/10">
      <h2 class="text-white font-bold text-lg">Nueva publicación</h2>
      <button (click)="close()" class="text-blue-300 hover:text-white transition p-1 rounded-lg hover:bg-white/10">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="px-6 py-5 space-y-4">

      <!-- Título -->
      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <label class="text-blue-100 text-sm font-medium">Título *</label>
          <span class="text-xs text-blue-400">{{ tituloLength }}/100</span>
        </div>
        <input
          formControlName="titulo"
          placeholder="Título de tu publicación"
          maxlength="100"
          class="w-full rounded-xl px-4 py-3 bg-white/10 border border-white/20 text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition text-sm" />
        <span class="text-red-400 text-xs min-h-4">{{ getError('titulo') }}</span>
      </div>

      <!-- Mensaje -->
      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <label class="text-blue-100 text-sm font-medium">Mensaje *</label>
          <span class="text-xs text-blue-400">{{ mensajeLength }}/1000</span>
        </div>
        <textarea
          formControlName="mensaje"
          placeholder="¿Qué querés compartir?"
          maxlength="1000"
          rows="4"
          class="w-full rounded-xl px-4 py-3 bg-white/10 border border-white/20 text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition text-sm resize-none"></textarea>
        <span class="text-red-400 text-xs min-h-4">{{ getError('mensaje') }}</span>
      </div>

      <!-- Imagen -->
      @if (imagePreview()) {
        <div class="relative">
          <img [src]="imagePreview()!" alt="Preview" class="w-full rounded-xl object-cover max-h-48" />
          <button type="button" (click)="removeImage()"
            class="absolute top-2 right-2 bg-black/60 text-white rounded-full p-1 hover:bg-red-500/80 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      } @else {
        <label class="flex items-center gap-2 cursor-pointer text-blue-300 hover:text-blue-200 transition text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
          Agregar imagen (opcional)
          <input type="file" accept="image/*" (change)="onFileChange($event)" class="hidden" />
        </label>
      }

      <!-- Botones -->
      <div class="flex gap-3 pt-1">
        <button type="button" (click)="close()"
          class="flex-1 rounded-xl py-2.5 px-4 text-sm font-medium text-blue-200 border border-white/20 hover:bg-white/10 transition">
          Cancelar
        </button>
        <button type="submit" [disabled]="isLoading()"
          class="flex-1 rounded-xl py-2.5 px-4 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-500 transition disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          @if (isLoading()) {
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
            Publicando...
          } @else {
            Publicar
          }
        </button>
      </div>

    </form>
  </div>
</div>
