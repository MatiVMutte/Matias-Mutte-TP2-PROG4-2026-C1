<div class="min-h-screen">

  <div class="max-w-2xl mx-auto px-4 py-8 space-y-5">

    <!-- Header -->
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold text-white">Publicaciones</h1>
      <button (click)="showModal.set(true)"
        class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 transition text-white text-sm font-semibold px-4 py-2 rounded-xl shadow">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Nueva publicación
      </button>
    </div>

    <!-- Ordenamiento -->
    <div class="flex gap-2">
      <button (click)="cambiarOrden('fecha')"
        class="text-sm px-4 py-1.5 rounded-xl font-medium transition"
        [class]="ordenar() === 'fecha'
          ? 'bg-blue-600 text-white shadow'
          : 'bg-white/10 text-blue-200 hover:bg-white/15'">
        Más recientes
      </button>
      <button (click)="cambiarOrden('likes')"
        class="text-sm px-4 py-1.5 rounded-xl font-medium transition"
        [class]="ordenar() === 'likes'
          ? 'bg-blue-600 text-white shadow'
          : 'bg-white/10 text-blue-200 hover:bg-white/15'">
        Más populares
      </button>
    </div>

    <!-- Spinner inicial -->
    @if (isLoading()) {
      <div class="flex justify-center py-16">
        <svg class="w-8 h-8 animate-spin text-blue-400" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
      </div>
    }

    <!-- Feed -->
    @if (!isLoading()) {
      @for (post of publicaciones(); track post._id) {
        <app-publicacion-card
          [post]="post"
          (onLike)="onLike($event)"
          (onDelete)="onDelete($event)" />
      }

      <!-- Sin publicaciones -->
      @if (publicaciones().length === 0) {
        <div class="text-center py-16 text-blue-300">
          <svg class="w-12 h-12 mx-auto mb-3 opacity-40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
          </svg>
          <p class="text-sm">Aún no hay publicaciones. ¡Sé el primero!</p>
        </div>
      }

      <!-- Cargar más -->
      @if (hasMore()) {
        <div class="flex justify-center pt-2">
          <button (click)="loadMore()" [disabled]="isLoadingMore()"
            class="flex items-center gap-2 text-sm text-blue-300 hover:text-white bg-white/10 hover:bg-white/15 transition px-5 py-2 rounded-xl disabled:opacity-60">
            @if (isLoadingMore()) {
              <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
              </svg>
              Cargando...
            } @else {
              Cargar más
            }
          </button>
        </div>
      }
    }

  </div>
</div>

<!-- Modal nueva publicación -->
@if (showModal()) {
  <app-nueva-publicacion-modal
    (onCreated)="onCreated($event)"
    (onClose)="showModal.set(false)" />
}
