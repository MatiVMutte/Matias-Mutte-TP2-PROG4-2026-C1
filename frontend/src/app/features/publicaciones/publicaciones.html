<div class="min-h-screen">

  <div class="max-w-2xl mx-auto px-4 py-8 space-y-6">

    <!-- Header -->
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold text-white">Publicaciones</h1>
      <button class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 transition text-white text-sm font-semibold px-4 py-2 rounded-xl shadow">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Nueva publicación
      </button>
    </div>

    <!-- Feed -->
    @for (post of publicaciones(); track post.id) {
      <article class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-5 space-y-4">

        <!-- Autor -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-semibold text-sm shrink-0">
            {{ getInitials(post.autor) }}
          </div>
          <div>
            <p class="text-white font-semibold text-sm">{{ post.autor }}</p>
            <p class="text-blue-300 text-xs">{{ post.fecha }}</p>
          </div>
        </div>

        <!-- Contenido -->
        <div>
          <h2 class="text-white font-bold text-base mb-1">{{ post.titulo }}</h2>
          <p class="text-blue-100 text-sm leading-relaxed">{{ post.mensaje }}</p>
        </div>

        @if (post.imagen) {
          <img [src]="post.imagen" alt="Imagen de la publicación"
            class="w-full rounded-xl object-cover max-h-64" />
        }

        <!-- Acciones -->
        <div class="flex items-center gap-4 pt-1 border-t border-white/10">
          <button (click)="toggleLike(post.id)"
            class="flex items-center gap-1.5 text-sm transition"
            [class]="post.liked ? 'text-blue-400 font-semibold' : 'text-blue-300 hover:text-blue-200'">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"
              [attr.fill]="post.liked ? 'currentColor' : 'none'">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M6.633 10.25c.806 0 1.533-.446 2.031-1.08a9.041 9.041 0 0 1 2.861-2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 0 0 .322-1.672V2.75a.75.75 0 0 1 .75-.75 2.25 2.25 0 0 1 2.25 2.25c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282m0 0h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 0 1-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 0 0-1.423-.23H5.904m10.598-9.75H14.25M5.904 18.5c.083.205.173.405.27.602.197.4-.078.898-.523.898h-.908c-.889 0-1.713-.518-1.972-1.368a12 12 0 0 1-.521-3.507c0-1.553.295-3.036.831-4.398C3.387 9.953 4.167 9.5 5 9.5h1.053c.472 0 .745.556.5.96a8.958 8.958 0 0 0-1.302 4.665c0 1.194.232 2.333.654 3.375Z" />
            </svg>
            {{ post.likes }}
          </button>
          <button class="flex items-center gap-1.5 text-sm text-blue-300 hover:text-blue-200 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.076-4.076a1.526 1.526 0 0 1 1.037-.443 48.282 48.282 0 0 0 5.68-.494c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
            </svg>
            {{ post.comentarios }}
          </button>
        </div>

      </article>
    }

  </div>
</div>
