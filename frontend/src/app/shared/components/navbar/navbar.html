<nav class="backdrop-blur-3xl sticky top-0 z-20" style="background-color: rgba(36, 52, 107, 0.6); box-shadow: 0 1px 0 rgba(255,255,255,0.08), 0 4px 24px rgba(0,0,0,0.45); border-bottom: 1px solid rgba(255,255,255,0.12);">
  <div class="max-w-4xl mx-auto px-4 py-2.5 flex items-center justify-between">

    <!-- Logo + nombre -->
    <a routerLink="/publicaciones" class="flex items-center gap-2.5 hover:opacity-80 transition">
      <img src="icon.svg" alt="AllUTN" class="w-8 h-8 rounded-full" />
      <span class="text-white font-bold text-xl tracking-tight">UTN</span>
    </a>

    <!-- Links -->
    <div class="flex items-center gap-1">
      <a routerLink="/publicaciones" routerLinkActive="bg-white/15 text-white"
        class="flex items-center gap-1.5 text-blue-200 hover:text-white hover:bg-white/10 transition text-sm font-medium px-3 py-1.5 rounded-xl">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
        </svg>
        Publicaciones
      </a>

      <a routerLink="/perfil" routerLinkActive="bg-white/15 text-white"
        class="flex items-center gap-1.5 text-blue-200 hover:text-white hover:bg-white/10 transition text-sm font-medium px-3 py-1.5 rounded-xl">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
        Mi perfil
      </a>

      @if (currentUser()?.perfil === 'administrador') {
        <a routerLink="/dashboard/usuarios" routerLinkActive="bg-white/15 text-white"
          class="flex items-center gap-1.5 text-amber-200 hover:text-white hover:bg-white/10 transition text-sm font-medium px-3 py-1.5 rounded-xl">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
          </svg>
          Usuarios
        </a>
        <a routerLink="/dashboard/estadisticas" routerLinkActive="bg-white/15 text-white"
          class="flex items-center gap-1.5 text-amber-200 hover:text-white hover:bg-white/10 transition text-sm font-medium px-3 py-1.5 rounded-xl">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
          </svg>
          Estadísticas
        </a>
      }

      <button (click)="logout()"
        class="flex items-center gap-1.5 text-blue-200 hover:text-red-300 hover:bg-red-500/10 transition text-sm font-medium px-3 py-1.5 rounded-xl ml-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
        </svg>
        Salir
      </button>
    </div>

  </div>
</nav>
