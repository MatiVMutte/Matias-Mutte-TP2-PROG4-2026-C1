@if (timer.showWarning()) {
  <div class="fixed inset-0 z-60 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="bg-slate-900/90 border border-white/15 rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl space-y-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-amber-500/20 flex items-center justify-center shrink-0">
          <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>
        </div>
        <div>
          <h3 class="text-white font-semibold text-base">Sesión por expirar</h3>
          <p class="text-blue-200 text-sm">Quedan 30 segundos. ¿Querés extender tu sesión?</p>
        </div>
      </div>
      <div class="flex gap-3 justify-end">
        <button (click)="onDismiss()"
          class="px-4 py-2 rounded-xl text-sm font-medium text-red-300 hover:text-red-200 hover:bg-red-500/10 transition">
          Cerrar sesión
        </button>
        <button (click)="onExtend()"
          class="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-500 transition">
          Extender sesión
        </button>
      </div>
    </div>
  </div>
}
